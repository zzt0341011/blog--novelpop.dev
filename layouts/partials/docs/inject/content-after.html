{{ if .Params.comments }}
<!-- Waline comment system -->
<div class="book-comments">
  <hr style="margin: 3rem 0 2rem 0; border: none; border-top: 1px solid var(--gray-200);">
  
  <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;">💬 Comments</h3>
  
  <!-- Load Waline styles -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/@waline/client@v3/dist/waline.css"
  />
  
  <!-- Waline container -->
  <div id="waline"></div>
  
  <!-- Waline init script -->
  <script type="module">
    import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
    
    init({
      el: '#waline',
      serverURL: 'https://waline1-pi.vercel.app/', // ⚠️ Replace this with your own address!
      lang: 'en',
      
      // English UI configuration
      locale: {
        placeholder: 'Leave a comment...',
        sofa: 'Be the first to comment!',
        submit: 'Submit',
        reply: 'Reply',
        cancelReply: 'Cancel reply',
        comment: 'Comment',
        refresh: 'Refresh',
        more: 'Load more...',
        preview: 'Preview',
        emoji: 'Emoji',
        uploadImage: 'Upload image',
        nick: 'Nickname',
        nickError: 'Nickname must be at least 3 characters',
        mail: 'Email',
        mailError: 'Please enter a valid email address',
        link: 'Website',
        optional: 'Optional',
        anonymous: 'Anonymous',
        login: 'Log in',
        logout: 'Log out',
        admin: 'Admin',
        word: 'words',
        wordHint: 'Your comment should be between $0 and $1 words!\nCurrent word count: $2',
        seconds: 'seconds ago',
        minutes: 'minutes ago',
        hours: 'hours ago',
        days: 'days ago',
        now: 'just now',
      },
      
      // Core configuration
      login: 'disable',           // Disable login, allow anonymous comments
      requiredMeta: ['nick'],     // Only require a nickname
      avatar: 'monsterid',        // Avatar style
      avatarCDN: 'https://sdn.geekzu.org/avatar/', // Avatar CDN
      pageSize: 10,               // Comments per page
      wordLimit: [0, 1000],       // Comment word limit: 0-1000
      dark: 'auto',               // Auto dark mode
      
      // Optional features (enable as needed)
      imageUploader: false,       // Disable image uploads
      highlighter: false,         // Disable code highlighting
      texRenderer: false,         // Disable math formulas
      search: false,              // Disable emoji search
      
      // Comment sorting
      commentSorting: 'latest',   // latest: newest first, oldest: oldest first, hottest: most popular first
    });
  </script>
</div>

<!-- Comment section style tweaks -->
<style>
  .book-comments {
    margin-top: 3rem;
    padding-top: 0;
  }
  
  .book-comments h3 {
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
    font-weight: 600;
  }
  
  #waline {
    margin-top: 1rem;
  }
  
  /* Adapt to the Hugo Book theme's dark mode */
  @media (prefers-color-scheme: dark) {
    .book-comments hr {
      border-top-color: var(--gray-700) !important;
    }
  }
  
  /* Make the comment box look better */
  .wl-editor {
    border-radius: 0.5rem;
  }
  
  .wl-btn {
    border-radius: 0.25rem;
  }
  
  /* Responsive tweaks */
  @media (max-width: 768px) {
    .book-comments {
      margin-top: 2rem;
    }
    
    .book-comments h3 {
      font-size: 1.25rem;
    }
  }
</style>
{{ end }}
