<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  body {
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f0f0f0;
    font-family: sans-serif;
    margin: 0;
  }
  .error-page {
    max-width: 600px;
    padding: 20px;
    background-color: #fff;
    border-radius: 5px;
  }
  h1 {
    color: #333;
  }
</style>
</head>
<body>
  <div class="error-page">
    <h1>404 - Page Not Found</h1>
    <p>Sorry, the page you visited does not exist. It may have been moved, deleted, or never created.</p>
    <p><a href="/">Return to the homepage</a></p>
  </div>
</body>
</html>
