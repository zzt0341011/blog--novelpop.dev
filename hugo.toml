baseURL = "https://novelpop.dev/"
languageCode = "zh-CN"
title = "novelpop.dev"
theme = "hugo-webstack"

# true：允许大写字母 URL 路径
# false：将 URL 路径转换成小写
disablePathToLower = true

# 页脚作者
copyright = "novelpop.dev"

# 网站信息，仅供搜索引擎参考
[params]
  keywords = "短剧, 小说, 霸道总裁, 玄幻, 都市, 吸血鬼, 武侠"
  description = "novelpop.dev，收集全网最好看的短剧，小说"

# 目录
[markup.tableOfContents]
  startLevel = 1

# =========================
# 多语言
# =========================

[languages]

[languages.zh]
  languageName = "中文"
  contentDir = "content.zh"
  weight = 1

[languages.en]
  languageName = "English"
  contentDir = "content.en"
  weight = 2
[languages.ru]
  languageName = "Русский"
  contentDir = "content.ru"
  weight = 3

# =========================
# 搜索
# =========================

[params.search]
  enable = true

# =========================
# 暗色模式
# =========================

[params.darkmode]
  enable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# =========================
# 拼音搜索
# =========================

[params.pinyin]
  enable = true

