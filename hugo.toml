baseURL = "https://novelpop.dev/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "novelpop.dev"
theme = "hugo-webstack"

# true: allow uppercase letters in URL paths
# false: convert URL paths to lowercase
disablePathToLower = true

# Footer author
copyright = "novelpop.dev"

# Site information, for search engines only
[params]
  keywords = "short drama, novel, billionaire CEO, fantasy, urban, vampire, martial arts"
  description = "novelpop.dev, collecting the best short dramas and novels from across the web"

# Table of contents
[markup.tableOfContents]
  startLevel = 1

# =========================
# Languages
# =========================

[languages]

[languages.en]
  languageName = "English"
  contentDir = "content.en"
  weight = 1

# =========================
# Search
# =========================

[params.search]
  enable = true

# =========================
# Dark mode
# =========================

[params.darkmode]
  enable = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# =========================
# Pinyin search
# =========================

[params.pinyin]
  enable = false

